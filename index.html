<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Esther — Working Notes</title>
<meta name="description" content="TP Group 생산관리 · Power BI · AI 협업 포트폴리오" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body { background-color: #f5f0e8; color: #1a1a1a; }

  .font-display { font-family: 'Fraunces', 'Noto Serif KR', serif; font-feature-settings: "ss01", "ss02"; }
  .font-serif-kr { font-family: 'Noto Serif KR', 'Newsreader', serif; }
  .font-body { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Sans KR', monospace; }

  .grain::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes drawLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fade-up { animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .draw-line { transform-origin: left; animation: drawLine 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.3s both; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; font-size: 11px;
    letter-spacing: 0.04em; border: 1px solid currentColor; border-radius: 999px; }

  textarea, input, select { font-family: inherit; }
  textarea:focus, input:focus, select:focus { outline: 2px solid #c2410c; outline-offset: 2px; }
</style>
</head>
<body class="font-body">
<div id="root"></div>

<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
}}
</script>

<script type="module">
import React, { useState, useEffect } from "react";
import { createRoot } from "react-dom/client";

const h = React.createElement;

// ---------- Persistent storage (localStorage) ----------
const store = {
  get(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { console.error(e); } },
};

// ---------- Seed data ----------
const SEED_PROJECTS = [
  { id: 'p1', code: '01',
    title: '출하 부족/초과 실적 추적 BI',
    titleEn: 'Shipment Shortage / Overship Tracking',
    status: 'active', period: '2026.04 — 진행 중',
    summary: 'Excel 기반 운영 보고서를 Power BI로 마이그레이션. 별 스키마 설계 후 차원 테이블 5종(Dim_Brand · Dim_Entity · Dim_OrderType · Dim_Exception · Dim_Date)을 구축. 관계 연결 및 DAX 측정값 설계 단계 진입.',
    stack: ['Power BI', 'DAX', 'Power Query (M)', 'Star Schema'],
    artifacts: ['차원 모델 ERD', '시즌/연도 결합 M 코드', '출하 예외 분류 체계'] },
  { id: 'p2', code: '02',
    title: '이란 전쟁 공급망 리스크 인텔리전스',
    titleEn: 'Iran War Supply Chain Risk Intelligence',
    status: 'shipped', period: '2026.03 — 2026.04',
    summary: '인도네시아·미얀마·베트남 3개국 생산기지에 대한 에너지/통화/물류 3축 리스크 분석. 현장 실측 데이터와 외부 인용 분석을 엄격히 분리. 미얀마를 최고 위험 지역으로 플래그.',
    stack: ['Strategic Analysis', 'PPTX', 'Risk Modeling'],
    artifacts: ['5-slide 국가별 요약 PPTX', '3-pillar 분석 프레임'] },
  { id: 'p3', code: '03',
    title: '주간 생산 손익 대시보드',
    titleEn: 'Weekly Production P&L Dashboard',
    status: 'shipped', period: '2026.02',
    summary: 'Power BI 기초 과정 결과물. 국가/법인 × 주차 매트릭스와 KPI 카드로 구성. 단위 포맷은 모델 뷰와 카드 비주얼 콜아웃 두 층으로 이원 처리.',
    stack: ['Power BI', 'KPI Cards', 'Matrix Visual'],
    artifacts: ['7-slide 교육 완료 보고서 PPTX', '네이비/틸 컬러 스킴'] },
];

const SEED_MILESTONES = [
  { id: 'm1', date: '2026.04', title: '차원 테이블 5종 구축 완료', detail: 'Dim_Brand · Dim_Entity · Dim_OrderType · Dim_Exception · Dim_Date — 별 스키마 모델링 완료', status: 'done' },
  { id: 'm2', date: '2026.04', title: '관계 연결 & DAX 측정값 설계', detail: '시즌/연도 결합 커스텀 컬럼 작성. K-수주 필터링은 Dim 테이블 대신 Power Query 단계에서 처리.', status: 'active' },
  { id: 'm3', date: '2026.05', title: '비주얼 레이아웃 & 배포', detail: '단위 포맷 이원화(모델 뷰 + 카드 콜아웃), 보고서 사용자 배포', status: 'planned' },
  { id: 'm4', date: '2026.04', title: '이란 전쟁 리스크 인텔리전스 보고', detail: '3개국 × 3축 분석 프레임. 미얀마 최고 위험 플래그.', status: 'done' },
  { id: 'm5', date: '2026.02', title: 'Power BI 기초 과정 수료', detail: '주간 생산 P&L 대시보드를 교육 결과물로 제출. 7-slide 완료 보고서 작성.', status: 'done' },
];

const SEED_ARCHIVE = [
  { id: 'a1', date: '2026.04', category: 'Power Query',
    problem: '시즌(SS/FW)과 수주연도 끝 두 자리를 하나의 식별자로 결합해야 함. 시즌 컬럼이 "Spring/Summer", "Fall/Winter"처럼 변칙으로 들어옴.',
    solution: 'Text.End · Text.Start · if-then 조합으로 단일 결합 컬럼. 첫 글자가 "S"면 SS, 아니면 FW.',
    code: 'Text.End(Text.From([수주년도]), 2) & (if Text.Start([Season], 1) = "S" then "SS" else "FW")' },
  { id: 'a2', date: '2026.04', category: 'DAX / 포맷팅',
    problem: '카드 비주얼에서 수량은 "장", 금액은 "$"로 표시해야 하는데 DAX FORMAT은 정렬과 집계에 영향이 있음.',
    solution: '두 단계로 분리. ① 모델 뷰에서 데이터 포맷을 #"장" / $0.0로 지정. ② 카드 비주얼 → 콜아웃 값 → 표시 단위 천 단위 / 소수점 1자리.',
    code: null },
  { id: 'a3', date: '2026.04', category: 'Power Query',
    problem: 'K로 시작하는 수주 문서 번호만 추려야 함. 별도 Dim 테이블을 둘지 PQ에서 필터링할지 결정 필요.',
    solution: 'Dim 테이블은 마스터 데이터일 때만. K-수주는 문자열 패턴이므로 Power Query 필터 단계에서 처리 → 모델이 가벼워짐.',
    code: 'Table.SelectRows(원본, each Text.StartsWith([Sales Doc], "K"))' },
];

const STATUS_LABELS = {
  active: { ko: '진행 중', dot: '#c2410c' },
  done: { ko: '완료', dot: '#2d4a3e' },
  shipped: { ko: '배포', dot: '#2d4a3e' },
  planned: { ko: '예정', dot: '#999' },
};

// ---------- App ----------
function App() {
  const [view, setView] = useState('home');
  const [logs, setLogs] = useState(() => store.get('portfolio:logs') || []);
  const [milestones, setMilestones] = useState(() => store.get('portfolio:milestones') || SEED_MILESTONES);
  const [archive, setArchive] = useState(() => store.get('portfolio:archive') || SEED_ARCHIVE);

  const persist = {
    logs:   v => { setLogs(v); store.set('portfolio:logs', v); },
    ms:     v => { setMilestones(v); store.set('portfolio:milestones', v); },
    arch:   v => { setArchive(v); store.set('portfolio:archive', v); },
  };

  return h('div', { className: 'font-body grain relative min-h-screen', style: { backgroundColor: '#f5f0e8', color: '#1a1a1a' } },
    h(Header, { view, setView }),
    h('main', { className: 'max-w-6xl mx-auto px-6 md:px-12 pb-32' },
      view === 'home'       && h(Home,       { setView, logs, milestones, archive }),
      view === 'projects'   && h(Projects,   {}),
      view === 'milestones' && h(Milestones, { items: milestones, persist: persist.ms }),
      view === 'log'        && h(DailyLog,   { items: logs, persist: persist.logs }),
      view === 'archive'    && h(Archive,    { items: archive, persist: persist.arch }),
    ),
    h(Footer, {})
  );
}

function Header({ view, setView }) {
  const nav = [
    { k: 'home', label: 'Index', num: '00' },
    { k: 'projects', label: 'Projects', num: '01' },
    { k: 'milestones', label: 'Milestones', num: '02' },
    { k: 'log', label: 'Daily Log', num: '03' },
    { k: 'archive', label: 'Problem Archive', num: '04' },
  ];
  return h('header', { className: 'border-b', style: { borderColor: '#1a1a1a' } },
    h('div', { className: 'max-w-6xl mx-auto px-6 md:px-12 py-5 flex items-center justify-between flex-wrap gap-4' },
      h('button', { onClick: () => setView('home'), className: 'font-display text-xl tracking-tight', style: { fontWeight: 500 } },
        'Esther ', h('span', { className: 'italic', style: { color: '#c2410c' } }, 'Working Notes')
      ),
      h('nav', { className: 'flex flex-wrap gap-x-5 gap-y-2 text-xs uppercase tracking-widest font-mono' },
        nav.map(n => h('button', {
          key: n.k, onClick: () => setView(n.k),
          className: `transition-opacity ${view === n.k ? '' : 'opacity-50 hover:opacity-100'}`,
          style: { color: view === n.k ? '#c2410c' : '#1a1a1a' }
        },
          h('span', { className: 'opacity-60 mr-1' }, n.num), n.label
        ))
      )
    )
  );
}

function SectionHeading({ num, title, subtitle }) {
  return h('div', { className: 'flex items-baseline gap-4 mb-6' },
    h('span', { className: 'font-mono text-xs opacity-60' }, `[${num}]`),
    h('h2', { className: 'font-display text-2xl md:text-3xl', style: { fontWeight: 500 } }, title),
    h('span', { className: 'font-mono text-xs italic opacity-50 hidden md:inline' }, `— ${subtitle}`)
  );
}

function ProjectCard({ p }) {
  const status = STATUS_LABELS[p.status];
  return h('article', { className: 'border p-6 relative hover:shadow-lg transition-shadow', style: { borderColor: '#1a1a1a', backgroundColor: 'rgba(255,255,255,0.4)' } },
    h('div', { className: 'flex items-baseline justify-between mb-4' },
      h('span', { className: 'font-mono text-xs opacity-60' }, `PROJECT — ${p.code}`),
      h('span', { className: 'tag font-mono', style: { color: status.dot } }, `● ${status.ko}`)
    ),
    h('h3', { className: 'font-display text-2xl mb-1', style: { fontWeight: 500 } }, p.title),
    h('p', { className: 'font-mono text-xs italic opacity-60 mb-4' }, `${p.titleEn} · ${p.period}`),
    h('p', { className: 'font-serif-kr text-sm leading-relaxed mb-5', style: { fontWeight: 300 } }, p.summary),
    h('div', { className: 'flex flex-wrap gap-1.5 mb-3' },
      p.stack.map(s => h('span', { key: s, className: 'tag font-mono opacity-70' }, s))
    ),
    p.artifacts && h('ul', { className: 'text-xs opacity-70 space-y-0.5 pt-3 border-t', style: { borderColor: 'rgba(26,26,26,0.15)' } },
      p.artifacts.map(a => h('li', { key: a }, `· ${a}`))
    )
  );
}

function Home({ setView, logs, milestones, archive }) {
  const stats = [
    { num: SEED_PROJECTS.length, label: 'Projects', sub: '진행 중 + 완료' },
    { num: milestones.filter(m => m.status === 'done').length, label: 'Milestones cleared', sub: '누적 마일스톤' },
    { num: logs.length, label: 'Daily entries', sub: 'AI 협업 일지' },
    { num: archive.length, label: 'Problems solved', sub: '문제 해결집' },
  ];
  return h('div', { className: 'pt-12 md:pt-20 fade-up' },
    h('p', { className: 'font-mono text-xs tracking-widest uppercase opacity-60 mb-6' }, '2026 — Production Mgmt × BI × AI'),
    h('h1', { className: 'font-display text-5xl md:text-7xl leading-[0.95] tracking-tight mb-8', style: { fontWeight: 400 } },
      '의류 제조 현장의', h('br'),
      h('span', { className: 'italic', style: { color: '#c2410c' } }, '데이터 인프라'), '를', h('br'),
      'Excel에서 BI로,', h('br'),
      '그리고 AI 협업으로.'
    ),
    h('div', { className: 'h-px draw-line mb-8', style: { backgroundColor: '#1a1a1a' } }),
    h('p', { className: 'font-serif-kr text-lg md:text-xl leading-relaxed max-w-3xl mb-16', style: { fontWeight: 300 } },
      'TP Group 생산관리 · 인도네시아 / 미얀마 / 베트남 3개국 생산기지의 운영 데이터를 Power BI로 옮기고, 전략 리스크를 분석하고, AI 에이전트와 함께 매일의 작업을 기록합니다. 이 페이지는 그 과정의 ',
      h('span', { className: 'italic' }, '현재진행형 포트폴리오'), '입니다.'
    ),
    h('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-px mb-20', style: { backgroundColor: '#1a1a1a' } },
      stats.map((s, i) => h('div', { key: i, className: 'p-5 md:p-6', style: { backgroundColor: '#f5f0e8' } },
        h('div', { className: 'font-display text-4xl md:text-5xl mb-1', style: { fontWeight: 500 } }, s.num),
        h('div', { className: 'font-mono text-[10px] uppercase tracking-widest opacity-70' }, s.label),
        h('div', { className: 'text-xs mt-1 opacity-60' }, s.sub)
      ))
    ),
    h(SectionHeading, { num: '01', title: '현재 진행 중', subtitle: 'Active Now' }),
    h('div', { className: 'grid md:grid-cols-2 gap-8 mb-20' },
      SEED_PROJECTS.filter(p => p.status === 'active').map(p => h(ProjectCard, { key: p.id, p })),
      h('button', { onClick: () => setView('projects'),
        className: 'border border-dashed p-6 text-left hover:bg-black/5 transition-colors',
        style: { borderColor: '#1a1a1a' } },
        h('div', { className: 'font-mono text-xs uppercase tracking-widest opacity-60 mb-2' }, '→ See all'),
        h('div', { className: 'font-display text-2xl' }, '전체 프로젝트 보기')
      )
    ),
    h(SectionHeading, { num: '02', title: '최근 마일스톤', subtitle: 'Recently Cleared' }),
    h('ul', { className: 'mb-16' },
      milestones.slice(0, 4).map(m => h('li', { key: m.id, className: 'flex items-baseline gap-4 py-3 border-b', style: { borderColor: 'rgba(26,26,26,0.15)' } },
        h('span', { className: 'font-mono text-xs opacity-50 w-20 shrink-0' }, m.date),
        h('span', { className: 'w-2 h-2 rounded-full shrink-0 translate-y-[3px]', style: { backgroundColor: STATUS_LABELS[m.status].dot } }),
        h('span', { className: 'font-serif-kr flex-1' }, m.title),
        h('span', { className: 'text-xs font-mono opacity-50 hidden md:inline' }, STATUS_LABELS[m.status].ko)
      ))
    )
  );
}

function Projects() {
  return h('div', { className: 'pt-12 fade-up' },
    h(SectionHeading, { num: '01', title: 'Projects', subtitle: '현재까지의 작업' }),
    h('p', { className: 'font-serif-kr text-base opacity-70 mb-10 max-w-2xl' },
      '업무 중 AI 에이전트와의 협업으로 만든 산출물 목록. 각 프로젝트는 별도의 마일스톤과 문제 해결 기록으로 연결됩니다.'),
    h('div', { className: 'grid md:grid-cols-2 gap-8' },
      SEED_PROJECTS.map(p => h(ProjectCard, { key: p.id, p }))
    )
  );
}

function Milestones({ items, persist }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ date: '', title: '', detail: '', status: 'done' });
  const submit = () => {
    if (!form.title || !form.date) return;
    persist([{ ...form, id: `m${Date.now()}` }, ...items]);
    setForm({ date: '', title: '', detail: '', status: 'done' }); setOpen(false);
  };
  const del = id => { if (confirm('삭제하시겠습니까?')) persist(items.filter(m => m.id !== id)); };

  return h('div', { className: 'pt-12 fade-up' },
    h('div', { className: 'flex items-end justify-between flex-wrap gap-4 mb-8' },
      h(SectionHeading, { num: '02', title: 'Milestones', subtitle: '여정의 이정표' }),
      h('button', { onClick: () => setOpen(!open),
        className: 'font-mono text-xs uppercase tracking-widest border px-4 py-2 hover:bg-black hover:text-white transition-colors',
        style: { borderColor: '#1a1a1a' } }, open ? '× Cancel' : '+ Add milestone')
    ),
    open && h('div', { className: 'border p-5 mb-8', style: { borderColor: '#1a1a1a', backgroundColor: 'rgba(255,255,255,0.5)' } },
      h('div', { className: 'grid md:grid-cols-2 gap-3 mb-3' },
        h('input', { className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          placeholder: 'Date (예: 2026.05)', value: form.date, onChange: e => setForm({ ...form, date: e.target.value }) }),
        h('select', { className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          value: form.status, onChange: e => setForm({ ...form, status: e.target.value }) },
          h('option', { value: 'done' }, '완료 / done'),
          h('option', { value: 'active' }, '진행 중 / active'),
          h('option', { value: 'planned' }, '예정 / planned')
        )
      ),
      h('input', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', style: { borderColor: '#1a1a1a' },
        placeholder: '제목 (예: 관계 연결 & DAX 측정값 설계)', value: form.title, onChange: e => setForm({ ...form, title: e.target.value }) }),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', rows: 3, style: { borderColor: '#1a1a1a' },
        placeholder: '상세 내용', value: form.detail, onChange: e => setForm({ ...form, detail: e.target.value }) }),
      h('button', { onClick: submit, className: 'font-mono text-xs uppercase tracking-widest px-4 py-2 text-white',
        style: { backgroundColor: '#c2410c' } }, 'Save')
    ),
    h('ol', { className: 'relative' },
      items.map(m => {
        const status = STATUS_LABELS[m.status] || STATUS_LABELS.done;
        return h('li', { key: m.id, className: 'grid grid-cols-[80px_24px_1fr_auto] gap-4 items-baseline py-5 border-b group', style: { borderColor: 'rgba(26,26,26,0.15)' } },
          h('span', { className: 'font-mono text-xs opacity-60' }, m.date),
          h('span', { className: 'w-2.5 h-2.5 rounded-full translate-y-1', style: { backgroundColor: status.dot } }),
          h('div', null,
            h('div', { className: 'font-display text-lg', style: { fontWeight: 500 } }, m.title),
            m.detail && h('div', { className: 'font-serif-kr text-sm opacity-75 mt-1', style: { fontWeight: 300 } }, m.detail)
          ),
          h('button', { onClick: () => del(m.id), className: 'font-mono text-xs opacity-30 hover:opacity-100 hover:text-red-700 transition-opacity' }, '×')
        );
      })
    )
  );
}

function DailyLog({ items, persist }) {
  const today = new Date().toISOString().slice(0, 10);
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ date: today, title: '', what: '', tools: '', learned: '' });
  const submit = () => {
    if (!form.title) return;
    persist([{ ...form, id: `l${Date.now()}` }, ...items]);
    setForm({ date: today, title: '', what: '', tools: '', learned: '' }); setOpen(false);
  };
  const del = id => { if (confirm('삭제?')) persist(items.filter(l => l.id !== id)); };

  return h('div', { className: 'pt-12 fade-up' },
    h('div', { className: 'flex items-end justify-between flex-wrap gap-4 mb-8' },
      h(SectionHeading, { num: '03', title: 'Daily Log', subtitle: 'AI 협업 일지' }),
      h('button', { onClick: () => setOpen(!open),
        className: 'font-mono text-xs uppercase tracking-widest border px-4 py-2 hover:bg-black hover:text-white transition-colors',
        style: { borderColor: '#1a1a1a' } }, open ? '× Cancel' : '+ New entry')
    ),
    items.length === 0 && !open && h('div', { className: 'border border-dashed p-10 text-center', style: { borderColor: 'rgba(26,26,26,0.3)' } },
      h('p', { className: 'font-serif-kr opacity-60 mb-2' }, '아직 기록된 일지가 없습니다.'),
      h('p', { className: 'font-mono text-xs opacity-50' }, '+ New entry로 첫 일지를 작성해보세요.')
    ),
    open && h('div', { className: 'border p-5 mb-8', style: { borderColor: '#1a1a1a', backgroundColor: 'rgba(255,255,255,0.5)' } },
      h('div', { className: 'grid md:grid-cols-2 gap-3 mb-3' },
        h('input', { type: 'date', className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          value: form.date, onChange: e => setForm({ ...form, date: e.target.value }) }),
        h('input', { className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          placeholder: '제목 (예: Dim_Date 시즌 컬럼 결합)', value: form.title, onChange: e => setForm({ ...form, title: e.target.value }) })
      ),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', rows: 3, style: { borderColor: '#1a1a1a' },
        placeholder: '오늘 한 일 (What I did today)', value: form.what, onChange: e => setForm({ ...form, what: e.target.value }) }),
      h('input', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', style: { borderColor: '#1a1a1a' },
        placeholder: '사용한 도구/AI (예: Claude · Power BI · Power Query)', value: form.tools, onChange: e => setForm({ ...form, tools: e.target.value }) }),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', rows: 2, style: { borderColor: '#1a1a1a' },
        placeholder: '배운 것 / 결정사항', value: form.learned, onChange: e => setForm({ ...form, learned: e.target.value }) }),
      h('button', { onClick: submit, className: 'font-mono text-xs uppercase tracking-widest px-4 py-2 text-white',
        style: { backgroundColor: '#c2410c' } }, 'Save entry')
    ),
    h('div', { className: 'space-y-6' },
      items.map(l => h('article', { key: l.id, className: 'border-l-2 pl-5 py-2 group', style: { borderColor: '#c2410c' } },
        h('div', { className: 'flex items-baseline justify-between mb-2' },
          h('div', { className: 'font-mono text-xs opacity-60' }, l.date),
          h('button', { onClick: () => del(l.id), className: 'font-mono text-xs opacity-0 group-hover:opacity-100 hover:text-red-700 transition-opacity' }, '×')
        ),
        h('h3', { className: 'font-display text-xl mb-2', style: { fontWeight: 500 } }, l.title),
        l.what && h('p', { className: 'font-serif-kr text-sm leading-relaxed mb-2', style: { fontWeight: 300 } }, l.what),
        l.tools && h('p', { className: 'font-mono text-[11px] opacity-60 mb-2' }, '⚙ ' + l.tools),
        l.learned && h('p', { className: 'font-serif-kr text-sm italic opacity-80 border-t pt-2 mt-2', style: { borderColor: 'rgba(26,26,26,0.15)', fontWeight: 300 } }, '↳ ' + l.learned)
      ))
    )
  );
}

function Archive({ items, persist }) {
  const [open, setOpen] = useState(false);
  const [filter, setFilter] = useState('All');
  const [form, setForm] = useState({ date: '', category: 'Power Query', problem: '', solution: '', code: '' });
  const cats = ['All', ...Array.from(new Set(items.map(i => i.category)))];
  const filtered = filter === 'All' ? items : items.filter(i => i.category === filter);
  const submit = () => {
    if (!form.problem || !form.solution) return;
    persist([{ ...form, id: `a${Date.now()}` }, ...items]);
    setForm({ date: '', category: 'Power Query', problem: '', solution: '', code: '' }); setOpen(false);
  };
  const del = id => { if (confirm('삭제?')) persist(items.filter(a => a.id !== id)); };

  return h('div', { className: 'pt-12 fade-up' },
    h('div', { className: 'flex items-end justify-between flex-wrap gap-4 mb-6' },
      h(SectionHeading, { num: '04', title: 'Problem Archive', subtitle: '문제 해결집' }),
      h('button', { onClick: () => setOpen(!open),
        className: 'font-mono text-xs uppercase tracking-widest border px-4 py-2 hover:bg-black hover:text-white transition-colors',
        style: { borderColor: '#1a1a1a' } }, open ? '× Cancel' : '+ Add case')
    ),
    h('div', { className: 'flex flex-wrap gap-2 mb-6' },
      cats.map(c => h('button', { key: c, onClick: () => setFilter(c),
        className: `tag font-mono ${filter === c ? 'text-white' : ''}`,
        style: { backgroundColor: filter === c ? '#1a1a1a' : 'transparent' } }, c))
    ),
    open && h('div', { className: 'border p-5 mb-8', style: { borderColor: '#1a1a1a', backgroundColor: 'rgba(255,255,255,0.5)' } },
      h('div', { className: 'grid md:grid-cols-2 gap-3 mb-3' },
        h('input', { className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          placeholder: 'Date (예: 2026.05)', value: form.date, onChange: e => setForm({ ...form, date: e.target.value }) }),
        h('input', { className: 'border px-3 py-2 text-sm bg-transparent', style: { borderColor: '#1a1a1a' },
          placeholder: '카테고리 (예: DAX, Power Query, 모델링)', value: form.category, onChange: e => setForm({ ...form, category: e.target.value }) })
      ),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', rows: 3, style: { borderColor: '#1a1a1a' },
        placeholder: '문제 상황', value: form.problem, onChange: e => setForm({ ...form, problem: e.target.value }) }),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3', rows: 3, style: { borderColor: '#1a1a1a' },
        placeholder: '해결 방법', value: form.solution, onChange: e => setForm({ ...form, solution: e.target.value }) }),
      h('textarea', { className: 'w-full border px-3 py-2 text-sm bg-transparent mb-3 font-mono', rows: 2, style: { borderColor: '#1a1a1a' },
        placeholder: '코드 (선택)', value: form.code, onChange: e => setForm({ ...form, code: e.target.value }) }),
      h('button', { onClick: submit, className: 'font-mono text-xs uppercase tracking-widest px-4 py-2 text-white',
        style: { backgroundColor: '#c2410c' } }, 'Save case')
    ),
    h('div', { className: 'space-y-8' },
      filtered.map((a, i) => h('article', { key: a.id, className: 'grid md:grid-cols-[120px_1fr] gap-6 pb-8 border-b group', style: { borderColor: 'rgba(26,26,26,0.2)' } },
        h('div', null,
          h('div', { className: 'font-mono text-xs opacity-60' }, a.date),
          h('span', { className: 'tag font-mono mt-2 inline-block', style: { color: '#c2410c', borderColor: '#c2410c' } }, a.category)
        ),
        h('div', null,
          h('h3', { className: 'font-display text-xl mb-2 flex items-baseline gap-3', style: { fontWeight: 500 } },
            h('span', { className: 'font-mono text-xs opacity-50' }, `CASE ${String(i + 1).padStart(2, '0')}`),
            '문제'
          ),
          h('p', { className: 'font-serif-kr leading-relaxed mb-4', style: { fontWeight: 300 } }, a.problem),
          h('h4', { className: 'font-display italic text-base mb-1', style: { color: '#2d4a3e', fontWeight: 500 } }, '↳ 해결'),
          h('p', { className: 'font-serif-kr leading-relaxed mb-3', style: { fontWeight: 300 } }, a.solution),
          a.code && h('pre', { className: 'font-mono text-xs p-3 overflow-x-auto', style: { backgroundColor: '#1a1a1a', color: '#f5f0e8' } }, a.code),
          h('button', { onClick: () => del(a.id), className: 'font-mono text-xs opacity-0 group-hover:opacity-100 hover:text-red-700 transition-opacity mt-2' }, '× 삭제')
        )
      ))
    )
  );
}

function Footer() {
  return h('footer', { className: 'border-t mt-20', style: { borderColor: '#1a1a1a' } },
    h('div', { className: 'max-w-6xl mx-auto px-6 md:px-12 py-8 flex justify-between items-baseline flex-wrap gap-4' },
      h('p', { className: 'font-mono text-xs opacity-60' }, '© Esther · Working Notes · 2026'),
      h('p', { className: 'font-mono text-xs italic opacity-50' }, 'Built with Claude · 매일 갱신됩니다')
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
